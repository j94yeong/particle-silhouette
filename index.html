<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Particle Silhouette</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060a;
    color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  /* The webcam video is hidden — we only consume its pixels. */
  #cam { display: none; }
  #scene {
    width: 100%;
    height: 100%;
    display: block;
    background: radial-gradient(ellipse at center, #0b1024 0%, #05060a 70%);
  }

  /* ---- Overlay / start gate ---- */
  #overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(5, 6, 10, 0.92);
    backdrop-filter: blur(6px);
    z-index: 10;
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  .card {
    max-width: 460px;
    background: rgba(20, 24, 44, 0.7);
    border: 1px solid rgba(120, 140, 255, 0.18);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .card h1 { font-size: 22px; margin-bottom: 10px; letter-spacing: 0.3px; }
  .card p { font-size: 14px; line-height: 1.6; color: #aab2d8; margin-bottom: 20px; }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    color: #05060a;
    background: linear-gradient(135deg, #7aa2ff, #58e6c9);
    padding: 12px 26px;
    border-radius: 999px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  button:active { transform: translateY(0); }
  #status { margin-top: 16px; font-size: 12.5px; color: #ff9a9a; min-height: 16px; }

  /* ---- HUD ---- */
  #hud {
    position: fixed;
    left: 14px;
    bottom: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 5;
    font-size: 12px;
  }
  #hud .pill {
    background: rgba(20, 24, 44, 0.6);
    border: 1px solid rgba(120, 140, 255, 0.18);
    border-radius: 999px;
    padding: 7px 13px;
    color: #cfd6ff;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  #hud .pill:hover { background: rgba(40, 48, 80, 0.8); }
  #fps {
    position: fixed;
    top: 12px;
    right: 14px;
    font-size: 11px;
    color: #6f78a8;
    z-index: 5;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted></video>
    <canvas id="scene"></canvas>
  </div>

  <div id="fps"></div>

  <div id="hud">
    <div class="pill" data-action="palette">🎨 Palette</div>
    <div class="pill" data-action="mirror">🪞 Mirror</div>
    <div class="pill" data-action="explode">💥 Explode</div>
    <div class="pill" data-action="pause">⏸ Pause</div>
  </div>

  <div id="overlay">
    <div class="card">
      <h1>Particle Silhouette</h1>
      <p>
        Allow camera access and your outline becomes a field of living particles.
        Move your mouse or finger across the screen to push them around.
        <br /><br />
        Everything runs on your device — no video ever leaves this page.
      </p>
      <button id="startBtn">Enable camera</button>
      <div id="status"></div>
    </div>
  </div>

  <!-- MediaPipe Selfie Segmentation (in-browser person mask) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <script>
  (() => {
    "use strict";

    const video   = document.getElementById("cam");
    const canvas  = document.getElementById("scene");
    const ctx     = canvas.getContext("2d", { alpha: false });
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const fpsEl   = document.getElementById("fps");

    // Offscreen canvas to read the segmentation mask cheaply at low res.
    const mask = document.createElement("canvas");
    const mctx = mask.getContext("2d", { willReadFrequently: true });

    // ---- Tunables ----
    const CFG = {
      sampleW: 160,     // mask sampling width (height derived from aspect)
      step: 5,          // particle grid stride in mask pixels (smaller = denser)
      ease: 0.16,       // how fast particles seek their target
      friction: 0.86,   // velocity damping
      pointerRadius: 110,
      pointerForce: 2.6,
      maskThreshold: 0.5,
    };

    const PALETTES = [
      ["#7aa2ff", "#58e6c9", "#b388ff"],
      ["#ff8fab", "#ffd6a5", "#fdffb6"],
      ["#00f5d4", "#00bbf9", "#9b5de5"],
      ["#f15bb5", "#fee440", "#00bbf9"],
    ];

    const state = {
      paletteIdx: 0,
      mirror: true,
      paused: false,
      running: false,
      pointer: { x: -1e6, y: -1e6, active: false },
      particles: [],
      cols: 0,
      rows: 0,
    };

    // ---------- Particle pool ----------
    // One particle per grid cell. A cell that falls inside the silhouette
    // pulls its particle "home" and lights it up; outside cells let it drift.
    function buildParticles(mw, mh) {
      const parts = [];
      const cols = Math.floor(mw / CFG.step);
      const rows = Math.floor(mh / CFG.step);
      for (let gy = 0; gy < rows; gy++) {
        for (let gx = 0; gx < cols; gx++) {
          const mx = gx * CFG.step + CFG.step / 2;
          const my = gy * CFG.step + CFG.step / 2;
          parts.push({
            mx, my,                 // home position in mask space
            x: Math.random() * mw,  // current position in mask space
            y: Math.random() * mh,
            vx: 0, vy: 0,
            life: 0,                // 0..1 brightness, eased
          });
        }
      }
      state.cols = cols;
      state.rows = rows;
      state.particles = parts;
    }

    // ---------- Layout ----------
    let scaleX = 1, scaleY = 1; // mask space -> canvas space
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      if (mask.width) {
        scaleX = canvas.width / mask.width;
        scaleY = canvas.height / mask.height;
      }
    }
    window.addEventListener("resize", resize);

    // ---------- Pointer interaction ----------
    function setPointer(e, active) {
      const dpr = canvas.width / window.innerWidth;
      const t = e.touches ? e.touches[0] : e;
      if (!t) return;
      state.pointer.x = t.clientX * dpr;
      state.pointer.y = t.clientY * dpr;
      state.pointer.active = active;
    }
    canvas.addEventListener("mousemove", (e) => setPointer(e, true));
    canvas.addEventListener("mouseleave", () => (state.pointer.active = false));
    canvas.addEventListener("touchstart", (e) => setPointer(e, true), { passive: true });
    canvas.addEventListener("touchmove", (e) => setPointer(e, true), { passive: true });
    canvas.addEventListener("touchend", () => (state.pointer.active = false));

    // ---------- HUD ----------
    document.getElementById("hud").addEventListener("click", (e) => {
      const action = e.target.dataset.action;
      if (action === "palette") state.paletteIdx = (state.paletteIdx + 1) % PALETTES.length;
      else if (action === "mirror") state.mirror = !state.mirror;
      else if (action === "explode") explode();
      else if (action === "pause") {
        state.paused = !state.paused;
        e.target.textContent = state.paused ? "▶ Resume" : "⏸ Pause";
      }
    });

    function explode() {
      for (const p of state.particles) {
        const a = Math.random() * Math.PI * 2;
        const s = 8 + Math.random() * 14;
        p.vx += Math.cos(a) * s;
        p.vy += Math.sin(a) * s;
      }
    }

    // ---------- Segmentation ----------
    let latestMaskData = null;
    let maskReady = false;

    function onResults(results) {
      const seg = results.segmentationMask;
      if (!seg) return;
      if (!mask.width) {
        const aspect = seg.height / seg.width;
        mask.width = CFG.sampleW;
        mask.height = Math.round(CFG.sampleW * aspect);
        buildParticles(mask.width, mask.height);
        resize();
      }
      // Mirror horizontally so it reads like a mirror by default.
      mctx.save();
      mctx.clearRect(0, 0, mask.width, mask.height);
      if (state.mirror) {
        mctx.translate(mask.width, 0);
        mctx.scale(-1, 1);
      }
      mctx.drawImage(seg, 0, 0, mask.width, mask.height);
      mctx.restore();
      latestMaskData = mctx.getImageData(0, 0, mask.width, mask.height).data;
      maskReady = true;
    }

    let selfieSeg = null;
    function initSegmentation() {
      selfieSeg = new SelfieSegmentation({
        locateFile: (f) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`,
      });
      selfieSeg.setOptions({ modelSelection: 1 }); // 1 = general (full body)
      selfieSeg.onResults(onResults);
    }

    // ---------- Camera pump ----------
    // We drive MediaPipe ourselves (instead of @mediapipe/camera_utils) to keep
    // the dependency list to one file.
    async function pumpCamera() {
      if (!state.paused && video.readyState >= 2) {
        try { await selfieSeg.send({ image: video }); } catch (_) {}
      }
      requestAnimationFrame(pumpCamera);
    }

    // ---------- Render loop ----------
    let lastT = performance.now();
    let fpsSmooth = 0;

    function maskValueAt(mx, my) {
      if (!latestMaskData) return 0;
      const ix = Math.max(0, Math.min(mask.width - 1, mx | 0));
      const iy = Math.max(0, Math.min(mask.height - 1, my | 0));
      // Mask is grayscale; red channel carries the person probability.
      return latestMaskData[(iy * mask.width + ix) * 4] / 255;
    }

    function render(now) {
      requestAnimationFrame(render);
      const dt = Math.min(2, (now - lastT) / 16.67);
      lastT = now;

      const fps = 1000 / Math.max(1, now - (render._p || now));
      render._p = now;
      fpsSmooth = fpsSmooth ? fpsSmooth * 0.9 + fps * 0.1 : fps;
      fpsEl.textContent = state.running ? Math.round(fpsSmooth) + " fps" : "";

      // Trail fade — gives particles a soft motion glow.
      ctx.fillStyle = "rgba(5, 6, 10, 0.28)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!maskReady || state.paused) return;

      const palette = PALETTES[state.paletteIdx];
      const px = state.pointer;
      const pr = CFG.pointerRadius * (canvas.width / window.innerWidth);

      ctx.globalCompositeOperation = "lighter";

      for (let i = 0; i < state.particles.length; i++) {
        const p = state.particles[i];
        const inside = maskValueAt(p.mx, p.my) > CFG.maskThreshold;

        // Brightness eases in/out so the body edge shimmers instead of snapping.
        p.life += ((inside ? 1 : 0) - p.life) * 0.12 * dt;

        // Seek home when inside; gently drift outward when not.
        if (inside) {
          p.vx += (p.mx - p.x) * CFG.ease * dt;
          p.vy += (p.my - p.y) * CFG.ease * dt;
        } else {
          p.vx += (Math.random() - 0.5) * 0.15 * dt;
          p.vy += (Math.random() - 0.5) * 0.15 * dt;
        }

        // Pointer repulsion (computed in canvas space).
        const cx = p.x * scaleX, cy = p.y * scaleY;
        if (px.active) {
          const dx = cx - px.x, dy = cy - px.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < pr * pr) {
            const d = Math.sqrt(d2) || 1;
            const f = (1 - d / pr) * CFG.pointerForce;
            p.vx += (dx / d) * f / scaleX * dt;
            p.vy += (dy / d) * f / scaleY * dt;
          }
        }

        p.vx *= CFG.friction;
        p.vy *= CFG.friction;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.life < 0.04) continue; // skip nearly-invisible particles

        const drawX = p.x * scaleX;
        const drawY = p.y * scaleY;
        const color = palette[i % palette.length];
        const r = (1.1 + p.life * 2.2) * (canvas.width / 1280) * 2;

        ctx.globalAlpha = Math.min(1, p.life);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(drawX, drawY, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    // ---------- Boot ----------
    async function start() {
      startBtn.disabled = true;
      statusEl.style.color = "#aab2d8";
      statusEl.textContent = "Requesting camera…";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();

        statusEl.textContent = "Loading segmentation model…";
        initSegmentation();
        // Warm up one frame so the model + mask canvas initialize.
        await selfieSeg.send({ image: video });

        state.running = true;
        overlay.classList.add("hidden");
        pumpCamera();
        requestAnimationFrame(render);
      } catch (err) {
        startBtn.disabled = false;
        statusEl.style.color = "#ff9a9a";
        const name = err && err.name;
        if (name === "NotAllowedError")
          statusEl.textContent = "Camera permission denied. Allow access and try again.";
        else if (name === "NotFoundError")
          statusEl.textContent = "No camera found on this device.";
        else if (location.protocol === "file:")
          statusEl.textContent = "Open this page over http(s) or localhost — file:// blocks the camera.";
        else
          statusEl.textContent = "Could not start camera: " + (err && err.message || err);
      }
    }

    startBtn.addEventListener("click", start);
    resize();
  })();
  </script>
</body>
</html>
