<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Particle Silhouette</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060a;
    color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  /* The webcam video is hidden — we only consume its pixels. */
  #cam { display: none; }
  #scene {
    width: 100%;
    height: 100%;
    display: block;
    background: radial-gradient(ellipse at center, #0b1024 0%, #05060a 70%);
  }

  /* ---- Overlay / start gate ---- */
  #overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(5, 6, 10, 0.92);
    backdrop-filter: blur(6px);
    z-index: 10;
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  .card {
    max-width: 460px;
    background: rgba(20, 24, 44, 0.7);
    border: 1px solid rgba(120, 140, 255, 0.18);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .card h1 { font-size: 22px; margin-bottom: 10px; letter-spacing: 0.3px; }
  .card p { font-size: 14px; line-height: 1.6; color: #aab2d8; margin-bottom: 20px; }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    color: #05060a;
    background: linear-gradient(135deg, #7aa2ff, #58e6c9);
    padding: 12px 26px;
    border-radius: 999px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  button:active { transform: translateY(0); }
  #status { margin-top: 16px; font-size: 12.5px; color: #ff9a9a; min-height: 16px; }

  /* ---- HUD ---- */
  #hud {
    position: fixed;
    left: 14px;
    bottom: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 5;
    font-size: 12px;
  }
  #hud .pill {
    background: rgba(20, 24, 44, 0.6);
    border: 1px solid rgba(120, 140, 255, 0.18);
    border-radius: 999px;
    padding: 7px 13px;
    color: #cfd6ff;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  #hud .pill:hover { background: rgba(40, 48, 80, 0.8); }
  #fps {
    position: fixed;
    top: 12px;
    right: 14px;
    font-size: 11px;
    color: #6f78a8;
    z-index: 5;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted></video>
    <canvas id="scene"></canvas>
  </div>

  <div id="fps"></div>

  <div id="hud">
    <div class="pill" data-action="palette">🎨 Palette</div>
    <div class="pill" data-action="mirror">🪞 Mirror</div>
    <div class="pill" data-action="explode">💥 Explode</div>
    <div class="pill" data-action="pause">⏸ Pause</div>
  </div>

  <div id="overlay">
    <div class="card">
      <h1>Particle Silhouette</h1>
      <p>
        Allow camera access and your outline becomes a field of living particles.
        Move your mouse or finger across the screen to push them around.
        <br /><br />
        Everything runs on your device — no video ever leaves this page.
      </p>
      <button id="startBtn">Enable camera</button>
      <div id="status"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
